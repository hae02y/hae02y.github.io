<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">멀티 에이전트 협업 흐름</title>
  <desc id="desc">오너가 계획하고 빌더가 구현한 뒤 리뷰어가 검증하며 공유 문서에 결과를 남기는 흐름</desc>
  <rect width="1200" height="560" rx="28" fill="#111827"/>
  <text x="70" y="72" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">에이전트 여러 개보다 중요한 것</text>
  <text x="70" y="108" fill="#aeb8ca" font-family="Arial, sans-serif" font-size="17">역할이 분리되고, 결과가 같은 문맥으로 돌아오는 구조</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="170" width="230" height="132" rx="18" fill="#23314a" stroke="#5c7cab" stroke-width="2"/>
    <text x="187" y="214" text-anchor="middle" fill="#9ec5ff" font-size="15" font-weight="700">OWNER</text>
    <text x="187" y="252" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">계획·범위</text>
    <text x="187" y="279" text-anchor="middle" fill="#bdc8da" font-size="14">작업 주소를 정한다</text>
    <path d="M325 236h92" stroke="#e5a44b" stroke-width="3"/>
    <path d="m402 222 22 14-22 14" fill="none" stroke="#e5a44b" stroke-width="3"/>
    <rect x="440" y="170" width="230" height="132" rx="18" fill="#273c32" stroke="#6da286" stroke-width="2"/>
    <text x="555" y="214" text-anchor="middle" fill="#a8e0bd" font-size="15" font-weight="700">BUILDER</text>
    <text x="555" y="252" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">구현·검증</text>
    <text x="555" y="279" text-anchor="middle" fill="#c3dccb" font-size="14">작은 결과물을 만든다</text>
    <path d="M693 236h92" stroke="#e5a44b" stroke-width="3"/>
    <path d="m770 222 22 14-22 14" fill="none" stroke="#e5a44b" stroke-width="3"/>
    <rect x="808" y="170" width="230" height="132" rx="18" fill="#4a3030" stroke="#b87575" stroke-width="2"/>
    <text x="923" y="214" text-anchor="middle" fill="#ffb4b4" font-size="15" font-weight="700">REVIEWER</text>
    <text x="923" y="252" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">검토·승인</text>
    <text x="923" y="279" text-anchor="middle" fill="#e3c4c4" font-size="14">같은 후보를 확인한다</text>
    <path d="M923 330v64" stroke="#e5a44b" stroke-width="3"/>
    <path d="m909 383 14 22 14-22" fill="none" stroke="#e5a44b" stroke-width="3"/>
    <rect x="330" y="410" width="540" height="80" rx="18" fill="#f7f3ec"/>
    <text x="600" y="445" text-anchor="middle" fill="#6d522e" font-size="15" font-weight="700">SHARED DOCUMENTS</text>
    <text x="600" y="472" text-anchor="middle" fill="#28231e" font-family="monospace" font-size="16">결정 · 작업 상태 · 테스트 결과 · 다음 단계</text>
    <path d="M187 330v34h318" fill="none" stroke="#71819b" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M1018 330v34H700" fill="none" stroke="#71819b" stroke-width="2" stroke-dasharray="7 7"/>
  </g>
</svg>
